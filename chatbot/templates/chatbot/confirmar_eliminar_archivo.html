{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body text-center">
        <i class="bi bi-exclamation-triangle text-warning fs-1"></i>
        <h5 class="mt-2">¿Eliminar el archivo "{{ archivo.nombre }}"?</h5>
        <p class="text-muted small">Si está enlazado a alguna opción del menú, esa opción quedará sin archivo.</p>
        <form method="post" class="mt-3">
          {% csrf_token %}
          <a href="{% url 'chatbot:lista_archivos' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
